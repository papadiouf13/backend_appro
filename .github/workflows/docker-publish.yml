name: Build and push backend image

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  IMAGE_NAME: supply-backend

jobs:
  docker:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Notify Dokploy via Webhook
        if: success()
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          set +e
          echo "Calling webhook..."

          response=$(curl -X POST "${WEBHOOK_URL}" \
            -w "\nHTTP_CODE:%{http_code}" \
            -s \
            --max-time 30)
          curl_exit_code=$?

          echo "Curl exit code: $curl_exit_code"
          echo "Response:"
          echo "$response"

          http_code=$(echo "$response" | grep "HTTP_CODE" | cut -d: -f2)
          echo "HTTP Code: $http_code"

          if [ "$http_code" = "200" ] || [ "$http_code" = "201" ] || [ "$http_code" = "204" ]; then
            echo "✅ Webhook successful with code: $http_code"
          else
            echo "⚠️ Webhook failed with code: $http_code (curl exit: $curl_exit_code)"
            echo "Note: This will not fail the deployment as the image was successfully pushed"
          fi
        timeout-minutes: 2
